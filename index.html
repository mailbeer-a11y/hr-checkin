<script>
const LIFF_ID = "2010063740-honG4FMh";
const GAS_URL = "https://script.google.com/macros/s/AKfycbz38705Xib9gsh6I9Ni6pIbDxsQtdbwFYnjEleJvAxyZoPZj3C5E8MPjas0purp4DsTwg/exec";

// 1. ตรวจสอบประวัติล่าสุด
var savedRecords = JSON.parse(localStorage.getItem('records') || '[]');
var currentCheckInStatus = savedRecords.length > 0 ? (savedRecords[0].type === 'in') : false;

// 2. ข้อมูล State หลัก (ล็อกค่าร้านไพศาลพานิช)
var state = {
  lat: null, lng: null, accuracy: null,
  officeLat: 15.8662189,
  officeLng: 100.5847802,
  radius: 300,
  inRange: false, 
  isCheckedIn: currentCheckInStatus,
  records: savedRecords,
  company: 'ร้านไพศาลพานิช',
  emp: 'กำลังโหลด...',
  userId: null
};

document.getElementById('companyName').textContent = state.company;

// คำนวณระยะทาง
function calcDist(lat1,lng1,lat2,lng2){
  var R=6371000,dLat=(lat2-lat1)*Math.PI/180,dLng=(lng2-lng1)*Math.PI/180;
  var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

// โหลด LINE LIFF
async function initializeLiff() {
  try {
    showLoading('กำลังดึงข้อมูล LINE...');
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    
    const profile = await liff.getProfile();
    state.emp = profile.displayName;
    state.userId = profile.userId;
    document.getElementById('empName').textContent = 'พนักงาน: ' + state.emp;
    
    hideLoading();
    startGPS(); // เมื่อได้ข้อมูล LINE แล้วค่อยเปิด GPS
  } catch (err) {
    hideLoading();
    showToast('❌ ไม่สามารถเชื่อมต่อ LINE ได้');
    startGPS();
  }
}

// เปิด GPS
function startGPS(){
  if(!navigator.geolocation){
    document.getElementById('locName').textContent='ไม่รองรับ GPS';
    return;
  }
  navigator.geolocation.watchPosition(onPos, onErr, {enableHighAccuracy:true,timeout:15000,maximumAge:5000});
}

function onPos(pos){
  state.lat = pos.coords.latitude;
  state.lng = pos.coords.longitude;
  state.accuracy = Math.round(pos.coords.accuracy);
  
  var dist = Math.round(calcDist(state.lat,state.lng,state.officeLat,state.officeLng));
  state.inRange = (dist <= state.radius);

  document.getElementById('locName').textContent='ตำแหน่ง: '+state.lat.toFixed(5)+', '+state.lng.toFixed(5);
  document.getElementById('locDist').textContent='ระยะห่าง: '+dist+' ม. (กำหนด: '+state.radius+' ม.)';

  var badge=document.getElementById('locBadge');
  badge.style.display='block';
  
  if(state.inRange){
    badge.className='loc-badge badge-ok'; badge.textContent='✅ อยู่ในพื้นที่';
    document.getElementById('infoStrip').innerHTML='✅ คุณอยู่ในรัศมีที่กำหนด';
    document.getElementById('infoStrip').style.background='#e6faf0';
    document.getElementById('infoStrip').style.color='#085041';
  } else {
    badge.className='loc-badge badge-no'; badge.textContent='❌ นอกพื้นที่';
    document.getElementById('infoStrip').innerHTML='❌ ห่างจากบริษัท '+dist+' เมตร (เกินกำหนด)';
    document.getElementById('infoStrip').style.background='#fde8e8';
    document.getElementById('infoStrip').style.color='#c62828';
  }

  // อัปเดตจุดแผนที่จำลอง
  var userEl=document.getElementById('mapUser');
  var ox=Math.min(60,Math.max(-60,(state.lng-state.officeLng)*8000));
  var oy=Math.min(60,Math.max(-60,(state.officeLat-state.lat)*8000));
  userEl.style.left='calc(50% + '+ox+'px)';
  userEl.style.top='calc(50% + '+oy+'px)';
  userEl.style.display='block';

  updateButtons(); // อัปเดตปุ่มเมื่อตำแหน่งเปลี่ยน
}

function onErr(err){
  document.getElementById('locName').textContent='ดึงตำแหน่งไม่สำเร็จ';
  document.getElementById('infoStrip').innerHTML='⚠️ กรุณาเปิดการระบุตำแหน่ง (GPS)';
}

// ควบคุมปุ่มกด
function updateButtons() {
  var ci = document.getElementById('btnCheckin');
  var co = document.getElementById('btnCheckout');
  if (!ci || !co) return;

  // เงื่อนไข 1: เช็คอินได้ก็ต่อเมื่อ "ในพื้นที่" และ "ยังไม่เช็คอิน"
  if (state.inRange === true && state.isCheckedIn === false) {
    ci.disabled = false; 
  } else {
    ci.disabled = true;  
  }

  // เงื่อนไข 2: เช็คเอาต์ได้เสมอ ถ้าสถานะคือ "กำลังเช็คอินอยู่"
  if (state.isCheckedIn === true) {
    co.disabled = false; 
  } else {
    co.disabled = true;  
  }
}

// ระบบเช็คอิน
function doCheckin() {
  if (!state.inRange) { showToast('❌ อยู่นอกพื้นที่'); return; }
  showLoading('กำลังบันทึกเวลาเข้า...');
  var now = new Date();
  var payload = { name: state.emp, userId: state.userId, type: "เช็คอิน", lat: state.lat, lng: state.lng, inRange: true };

  fetch(GAS_URL, { method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(payload) })
  .then(res => res.json())
  .then(data => {
    hideLoading();
    if (data.status === "success" || data.status === "ok") {
      state.records.unshift({ type: 'in', time: now.toISOString(), lat: state.lat, lng: state.lng, inRange: true });
      state.isCheckedIn = true;
      save();
      updateStatusUI(now, 'in'); loadTodaySummary(); renderHistory(); updateButtons();
      showToast('✅ เช็คอินสำเร็จ');
    } else { showToast('❌ Error: ' + data.message); }
  }).catch(e => { hideLoading(); showToast('❌ ขัดข้อง รบกวนกดใหม่'); });
}

// ระบบเช็คเอาต์
function doCheckout() {
  showLoading('กำลังบันทึกเวลาออก...');
  var now = new Date();
  var payload = { name: state.emp, userId: state.userId, type: "เช็คเอาต์", lat: state.lat, lng: state.lng, inRange: state.inRange };

  fetch(GAS_URL, { method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(payload) })
  .then(res => res.json())
  .then(data => {
    hideLoading();
    if (data.status === "success" || data.status === "ok") {
      state.records.unshift({ type: 'out', time: now.toISOString(), lat: state.lat, lng: state.lng, inRange: state.inRange });
      state.isCheckedIn = false;
      save();
      updateStatusUI(now, 'out'); loadTodaySummary(); renderHistory(); updateButtons();
      showToast('✅ เช็คเอาต์สำเร็จ');
    } else { showToast('❌ Error: ' + data.message); }
  }).catch(e => { hideLoading(); showToast('❌ ขัดข้อง รบกวนกดใหม่'); });
}

function updateStatusUI(dt,type){
  var dot=document.getElementById('statusDot');
  var txt=document.getElementById('statusText');
  var time=document.getElementById('statusTime');
  if(type==='in'){
    dot.className='status-dot dot-in'; txt.textContent='กำลังทำงาน';
    time.textContent='เช็คอินเมื่อ: '+fmtTime(dt)+' น. ('+fmtDate(dt)+')';
  } else {
    dot.className='status-dot dot-out'; txt.textContent='ออกงานแล้ว';
    time.textContent='เช็คเอาต์เมื่อ: '+fmtTime(dt)+' น. ('+fmtDate(dt)+')';
  }
}

function loadTodaySummary(){
  var today=new Date().toDateString();
  var ins=state.records.filter(r => r.type==='in'&&new Date(r.time).toDateString()===today);
  var outs=state.records.filter(r => r.type==='out'&&new Date(r.time).toDateString()===today);
  document.getElementById('todayIn').textContent=ins.length?fmtTime(new Date(ins[ins.length-1].time)):'--';
  document.getElementById('todayOut').textContent=outs.length?fmtTime(new Date(outs[0].time)):'--';
}

function renderHistory(){
  var el=document.getElementById('histList');
  if(!state.records.length){el.innerHTML='<div class="hist-empty">ยังไม่มีประวัติการลงเวลา</div>';return;}
  el.innerHTML=state.records.map(r => {
    var dt=new Date(r.time);
    var icon=r.type==='in'?'🟢':'🔴';
    var label=r.type==='in'?'เช็คอิน':'เช็คเอาต์';
    var iconClass=r.type==='in'?'hist-icon-in':'hist-icon-out';
    var badge=r.inRange?'<span class="hist-badge hist-badge-ok">อยู่ในพื้นที่</span>':'<span class="hist-badge hist-badge-no">นอกพื้นที่</span>';
    var coords=r.lat?r.lat.toFixed(4)+', '+r.lng.toFixed(4):'-';
    return '<div class="hist-item"><div class="hist-icon '+iconClass+'">'+icon+'</div><div class="hist-detail"><div class="hist-type">'+label+'</div><div class="hist-time">'+fmtTime(dt)+' น. — '+fmtDate(dt)+'</div><div class="hist-loc">📍 '+coords+'</div></div>'+badge+'</div>';
  }).join('');
}

function clearHistory(){
  if(confirm('ต้องการล้างประวัติทั้งหมดใช่ไหม?')){
    state.records=[]; state.isCheckedIn=false; save(); renderHistory(); loadTodaySummary();
    document.getElementById('statusDot').className='status-dot dot-out';
    document.getElementById('statusText').textContent='ยังไม่ได้เช็คอิน';
    document.getElementById('statusTime').textContent='--';
    updateButtons(); showToast('🗑️ ล้างประวัติแล้ว');
  }
}

function save(){localStorage.setItem('records',JSON.stringify(state.records));}

var tabs=['home','history'];
function showPage(page,tabEl,navId){
  tabs.forEach(t => {
    var p=document.getElementById('page-'+t); if(p) p.classList.remove('active');
    var nav=document.getElementById('nav-'+t); if(nav) nav.classList.remove('active');
  });
  document.querySelectorAll('.htab').forEach(t => t.classList.remove('active'));
  var pageEl=document.getElementById('page-'+page); if(pageEl) pageEl.classList.add('active');
  if(tabEl) tabEl.classList.add('active');
  if(navId){ var nId=document.getElementById(navId); if(nId) nId.classList.add('active'); }
}

function fmtTime(d){return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');}
function fmtDate(d){var m=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];return d.getDate()+' '+m[d.getMonth()]+' '+(d.getFullYear()+543);}
function showLoading(txt){document.getElementById('loading').classList.add('show');document.getElementById('loadingText').textContent=txt||'...';}
function hideLoading(){document.getElementById('loading').classList.remove('show');}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2800);}

// การทำงานเมื่อโหลดหน้าเว็บ
if (state.records.length > 0) {
  updateStatusUI(new Date(state.records[0].time), state.records[0].type);
}
renderHistory();
loadTodaySummary();

// เริ่มต้นระบบเชื่อมต่อ LINE
initializeLiff();
</script>
